[project]
name = "searchboard"
version = "0.1.0"
description = "Personal daily job-search pipeline."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["searchboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
